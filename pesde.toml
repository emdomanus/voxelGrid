name = "emdomanus/voxel_grid"
version = "0.1.0"
description = "A generic in-memory voxel-grid spatial index for Roblox."
license = "Proprietary"
authors = ["emdomanus"]
private = true

includes = [
	"pesde.toml",
	"LICENSE",
	"README.md",
	"src/**/*.luau",
]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"
